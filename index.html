<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>My Digital Agency</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #18243a;
}
header {
  background: #142b58;
  color: white;
  padding: 22px;
  text-align: center;
}
.hero {
  background: #eef5ff;
  padding: 75px 20px;
  text-align: center;
}
h1 { font-size: clamp(30px, 6vw, 50px); }
p { line-height: 1.7; }
.btn {
  display: inline-block;
  background: #1266e8;
  color: white;
  padding: 14px 24px;
  border-radius: 8px;
  text-decoration: none;
}
  .services {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(200px, 1fr));
  gap: 18px;
  padding: 30px 20px;
}
.service {
  border: 1px solid #ddd;
  padding: 22px;
  border-radius: 12px;
}
footer {
  background: #142b58;
  color: white;
  text-align: center;
  padding: 22px;
}
</style>
</head>
<body>
<header>
  <h2>My Digital Agency</h2>
</header>
  
</section>

<section class="services">
  <div class="service">
    <h2>Web Design</h2>
    <p>Modern and attractive websites.</p>
  </div>
  <div class="service">
    <h2>Responsive Design</h2>
    <p>Mobile and desktop friendly.</p>
  </div>
  <div class="service">
    <h2>Landing Pages</h2>
    <p>Professional business landing pages.</p>
  </div>
</section>

<footer>© 2026 My Digital Agency</footer>
</body>
</html>
